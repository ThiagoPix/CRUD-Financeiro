name: crud-financeiro

services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-crud_financeiro}
      POSTGRES_USER: ${DB_USER:-financeiro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dados_financeiros:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados_financeiros:
